name: Terraform CI - Perp Project

on:
  push:
    paths:
      - 'terraform/perp-project/**'
  pull_request:
    paths:
      - 'terraform/perp-project/**'
  workflow_dispatch:

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/perp-project

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

      # Auto-apply only on push to main branch
      - name: Terraform Destroy
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: terraform destroy -auto-approve

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}

      # Terraform variables from dev secrets
      TF_VAR_project_name: ${{ secrets.DEV_PROJECT_NAME }}
      TF_VAR_vpcproject_name: ${{ secrets.DEV_VPC_PROJECT_NAME }}
      TF_VAR_state_bucket: ${{ secrets.DEV_STATE_BUCKET }}
      TF_VAR_ssh_key_name: ${{ secrets.DEV_SSH_KEY_NAME }}
      TF_VAR_instance_name: ${{ secrets.DEV_INSTANCE_NAME }}
      TF_VAR_environment: ${{ secrets.DEV_ENVIRONMENT }}
