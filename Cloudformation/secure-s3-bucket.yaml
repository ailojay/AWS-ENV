AWSTemplateFormatVersion: "2010-09-09"
Description: Secure S3 bucket with encryption, fixed bucket name, logging bucket, and versioning disabled

Resources:
  SecureS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: arz-bucket-007  # Replace with your desired unique bucket name
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Suspended   # Disables versioning
      LoggingConfiguration:
        DestinationBucketName: arz-logging-bucket-007  # Replace with your existing log bucket name
        LogFilePrefix: access-logs/
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
