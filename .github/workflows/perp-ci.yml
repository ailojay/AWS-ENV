name: Terraform CI - Perp Project

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy (dev/prod)'
        required: true
        default: dev
  push:
    paths:
      - 'terraform/perp-project/**'
  pull_request:
    paths:
      - 'terraform/perp-project/**'

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/perp-project

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        env:
          TF_VAR_project_name: ${{ secrets[github.event.inputs.environment | upper + '_PROJECT_NAME'] }}
          TF_VAR_vpcproject_name: ${{ secrets[github.event.inputs.environment | upper + '_VPC_PROJECT_NAME'] }}
          TF_VAR_state_bucket: ${{ secrets[github.event.inputs.environment | upper + '_STATE_BUCKET'] }}
          TF_VAR_ssh_key_name: ${{ secrets[github.event.inputs.environment | upper + '_SSH_KEY_NAME'] }}
          TF_VAR_instance_name: ${{ secrets[github.event.inputs.environment | upper + '_INSTANCE_NAME'] }}
          TF_VAR_environment: ${{ secrets[github.event.inputs.environment | upper + '_ENVIRONMENT'] }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: terraform plan

      # Uncomment this when ready to auto-apply on push
      # - name: Terraform Apply
